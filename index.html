<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Библиотека Трёх Дверей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bordeaux: #5B0015;
      --bordeaux-dark: #38000D;
      --horizon: #80AEE8;
      --ivory: #F7F2E0;
      --success: #63b97b;
      --error: #e06c75;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bordeaux-dark);
      color: var(--ivory);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      transition: background-image 0.4s ease;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(91, 0, 21, 0.65) 0%, rgba(42, 0, 10, 0.88) 100%);
      z-index: 1;
      pointer-events: none;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: linear-gradient(180deg, rgba(42, 0, 10, 0.85) 0%, transparent 100%);
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--ivory);
      text-shadow: 0 2px 12px rgba(128, 174, 232, 0.45);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-ghost {
      background: rgba(91, 0, 21, 0.75);
      border: 1px solid var(--horizon);
      color: var(--ivory);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: 'Montserrat', sans-serif;
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
    }

    .btn-ghost:hover {
      background: var(--horizon);
      color: var(--bordeaux-dark);
      font-weight: 600;
    }

    main {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 1050px;
      padding: 95px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-style: italic;
      color: var(--ivory);
      margin-bottom: 38px;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .doors-stage {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      perspective: 1200px;
      width: 100%;
    }

    .door-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.35s ease;
    }

    .door-wrapper:hover {
      transform: translateY(-10px);
    }

    .door-frame {
      width: 215px;
      height: 335px;
      border: 3px solid var(--horizon);
      border-radius: 108px 108px 8px 8px;
      padding: 8px;
      background: linear-gradient(180deg, rgba(128, 174, 232, 0.25) 0%, rgba(56, 0, 13, 0.95) 100%);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75), 0 0 22px rgba(128, 174, 232, 0.22);
      position: relative;
      transition: box-shadow 0.35s ease;
    }

    .door-wrapper:hover .door-frame {
      box-shadow: 0 22px 50px rgba(128, 174, 232, 0.45), inset 0 0 25px rgba(128, 174, 232, 0.3);
    }

    .door-glow {
      position: absolute;
      inset: 8px;
      border-radius: 98px 98px 4px 4px;
      background: radial-gradient(circle at center, var(--ivory) 0%, var(--horizon) 55%, var(--bordeaux) 100%);
      opacity: 0.22;
      transition: opacity 0.6s ease;
    }

    .door-wrapper.opening .door-glow {
      opacity: 1;
    }

    .door-leaf {
      width: 100%;
      height: 100%;
      border-radius: 98px 98px 4px 4px;
      background: linear-gradient(145deg, var(--bordeaux) 0%, var(--bordeaux-dark) 100%);
      border: 1px solid rgba(128, 174, 232, 0.45);
      position: relative;
      transform-origin: left center;
      transition: transform 0.85s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .door-wrapper.opening .door-leaf {
      transform: rotateY(-78deg);
    }

    .door-leaf::before {
      content: '';
      position: absolute;
      inset: 16px;
      border-radius: 82px 82px 2px 2px;
      border: 1px solid rgba(247, 242, 224, 0.22);
      pointer-events: none;
    }

    .door-knob {
      position: absolute;
      right: 18px;
      top: 54%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--ivory), var(--horizon));
      box-shadow: 0 0 10px rgba(128, 174, 232, 0.8);
    }

    .door-plaque {
      margin-top: 18px;
      background: var(--ivory);
      border: 2px solid var(--horizon);
      padding: 9px 20px;
      border-radius: 8px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--bordeaux);
      text-align: center;
      min-width: 195px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
    }

    .loader {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin: 50px 0;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 3px solid rgba(247, 242, 224, 0.2);
      border-top-color: var(--horizon);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result-card {
      display: none;
      width: 100%;
      max-width: 730px;
      background: rgba(91, 0, 21, 0.93);
      border: 2px solid var(--horizon);
      border-radius: 18px;
      padding: 34px;
      backdrop-filter: blur(14px);
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.85);
      animation: fadeUp 0.45s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: var(--horizon);
      color: var(--bordeaux-dark);
      margin-bottom: 14px;
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      line-height: 1.2;
      color: var(--ivory);
      margin-bottom: 16px;
    }

    .card-text {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--ivory);
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .highlight-box {
      background: rgba(247, 242, 224, 0.1);
      border-left: 4px solid var(--horizon);
      padding: 14px 18px;
      border-radius: 0 10px 10px 0;
      margin-bottom: 22px;
      font-size: 0.93rem;
      line-height: 1.6;
      color: var(--ivory);
    }

    .timer-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(56, 0, 13, 0.75);
      border: 1px solid var(--horizon);
      border-radius: 14px;
      padding: 24px;
      margin: 20px 0;
    }

    .timer-display {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4.2rem;
      font-weight: 700;
      color: var(--horizon);
      letter-spacing: 3px;
      margin-bottom: 14px;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
    }

    .btn-primary {
      background: var(--horizon);
      color: var(--bordeaux-dark);
      border: none;
      padding: 11px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    .quiz-section {
      margin-top: 24px;
      border-top: 1px solid rgba(128, 174, 232, 0.35);
      padding-top: 20px;
    }

    .quiz-item {
      margin-bottom: 20px;
    }

    .quiz-question {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.96rem;
      color: var(--ivory);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quiz-opt {
      background: rgba(247, 242, 224, 0.08);
      border: 1px solid rgba(128, 174, 232, 0.4);
      color: var(--ivory);
      padding: 11px 15px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: 'Montserrat', sans-serif;
      transition: all 0.2s ease;
    }

    .quiz-opt:hover:not(:disabled) {
      background: rgba(128, 174, 232, 0.25);
      border-color: var(--horizon);
    }

    .quiz-opt.correct {
      background: rgba(99, 185, 123, 0.3);
      border-color: var(--success);
      color: #e4ffeb;
    }

    .quiz-opt.wrong {
      background: rgba(224, 108, 117, 0.3);
      border-color: var(--error);
      color: #ffe3e6;
    }

    .card-footer {
      margin-top: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="bg-layer" id="bg-layer"></div>
  <div class="bg-overlay"></div>

  <header>
    <div class="logo">✦ Библиотека Трёх Дверей</div>
    <div class="header-actions">
      <input type="file" id="bg-file-input" accept="image/*" style="display:none;" />
      <button class="btn-ghost" id="btn-bg">🖼 Фон</button>
      <button class="btn-ghost" id="btn-shuffle">↻ Другие двери</button>
    </div>
  </header>

  <main>
    <p class="subtitle" id="stage-hint">Выбери одну из дверей — за каждой скрыто случайное испытание или открытие...</p>

    <div class="doors-stage" id="doors-stage">
      <div class="door-wrapper" data-index="0">
        <div class="door-frame">
          <div class="door-glow"></div>
          <div class="door-leaf"><div class="door-knob"></div></div>
        </div>
        <div class="door-plaque" id="plaque-0">Дверь Гоголя</div>
      </div>

      <div class="door-wrapper" data-index="1">
        <div class="door-frame">
          <div class="door-glow"></div>
          <div class="door-leaf"><div class="door-knob"></div></div>
        </div>
        <div class="door-plaque" id="plaque-1">Дверь Есенина</div>
      </div>

      <div class="door-wrapper" data-index="2">
        <div class="door-frame">
          <div class="door-glow"></div>
          <div class="door-leaf"><div class="door-knob"></div></div>
        </div>
        <div class="door-plaque" id="plaque-2">Дверь Маяковского</div>
      </div>
    </div>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p style="color: var(--ivory); font-style: italic;">Библиотекарь составляет задание...</p>
    </div>

    <div class="result-card" id="result-card">
      <span class="badge" id="res-badge">Категория</span>
      <h2 class="card-title" id="res-title">Заголовок</h2>
      <div class="card-text" id="res-body">Текст задания</div>
      <div class="highlight-box" id="res-extra" style="display:none;"></div>

      <div class="timer-box" id="timer-box" style="display:none;">
        <div class="timer-display" id="timer-display">30:00</div>
        <div class="timer-controls">
          <button class="btn-primary" id="timer-toggle-btn">▶ Старт</button>
          <button class="btn-ghost" id="timer-reset-btn">↺ Сбросить</button>
        </div>
      </div>

      <div class="quiz-section" id="quiz-section" style="display:none;">
        <h3 style="font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--horizon); margin-bottom: 14px;">Мини-проверка на внимательность</h3>
        <div id="quiz-container"></div>
      </div>

      <div class="card-footer">
        <button class="btn-ghost" id="btn-back">← Вернуться к дверям</button>
        <span id="status-label" style="font-size: 0.78rem; color: var(--horizon);"></span>
      </div>
    </div>
  </main>

  <script>
    const writers = [
      "Дверь Гоголя", "Дверь Есенина", "Дверь Маяковского",
      "Дверь Чехова", "Дверь Булгакова", "Дверь Достоевского",
      "Дверь Набокова", "Дверь Ахматовой", "Дверь Цветаевой",
      "Дверь Борхеса", "Дверь Бродского", "Дверь Платонова",
      "Дверь Хармса", "Дверь Куприна", "Дверь Пастернака"
    ];

    const fallbackWriting = [
      {
        title: "Приём: Кольцевая композиция",
        body: "Кольцевая композиция возвращает читателя в финале к начальной сцене, образу или фразе, но уже с новым смыслом.\n\nРекомендуемый рассказ для разбора: Иван Бунин — «Лёгкое дыхание» или О. Генри — «Дары волхвов».",
        extra: "На что обратить внимание: как одна и та же деталь в начале и в конце рассказа меняет своё эмоциональное звучание.",
        quiz: [
          {
            q: "В чём главная художественная сила кольцевой композиции?",
            opts: ["Она позволяет увеличить объём текста", "Она показывает внутренний сдвиг героя через повтор", "Она заменяет развязку"],
            ans: 1
          },
          {
            q: "Что обычно связывает начало и финал при таком приёме?",
            opts: ["Повторяющаяся деталь, место действия или фраза", "Одинаковое число абзацев", "Смена рассказчика"],
            ans: 0
          }
        ]
      },
      {
        title: "Приём: Ненадёжный рассказчик",
        body: "Ненадёжный рассказчик — это повествователь, чьим словам нельзя верить полностью из-за его предвзятости, наивности или желания скрыть правду.\n\nРекомендуемый рассказ для разбора: Эдгар Аллан По — «Сердце-обличитель» или Рюноскэ Акутагава — «В чаще».",
        extra: "На что обратить внимание: ищи противоречия между словами героя и его реальными поступками.",
        quiz: [
          {
            q: "Как читатель понимает, что рассказчик ненадёжен?",
            opts: ["Автор пишет об этом в сноске", "В тексте появляются нестыковки и чрезмерные самооправдания", "Рассказ написан от третьего лица"],
            ans: 1
          }
        ]
      }
    ];

    const fallbackSelfDev = [
      {
        title: "Эффект Зейгарник и оперативная память мозга",
        body: "Психолог Блюма Зейгарник доказала, что мозг удерживает в активном фокусе незавершённые задачи гораздо сильнее, чем выполненные. Из-за этого возникает фоновая тревога.\n\nИзучи сегодня, как выгрузка задач на бумагу освобождает внимание.",
        extra: "Практика на 15 минут: найди короткую лекцию об эффекте Зейгарник и выпиши 3 способа закрывать «висящие» дела."
      },
      {
        title: "Метод Фейнмана: проверка глубины знаний",
        body: "Физик Ричард Фейнман считал: если ты не можешь объяснить сложную тему простыми словами без терминов, значит, ты сам понял её недостаточно глубоко.",
        extra: "Практика на 15 минут: запиши на листе бумаги объяснение одного сложного понятия из учёбы максимально простым языком."
      }
    ];

    // Загрузка сохраненного фона
    const savedBg = localStorage.getItem('library_custom_bg');
    if (savedBg) {
      document.getElementById('bg-layer').style.backgroundImage = `url('${savedBg}')`;
    }

    document.getElementById('btn-bg').addEventListener('click', () => {
      document.getElementById('bg-file-input').click();
    });

    document.getElementById('bg-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const dataUrl = ev.target.result;
        document.getElementById('bg-layer').style.backgroundImage = `url('${dataUrl}')`;
        try {
          localStorage.setItem('library_custom_bg', dataUrl);
        } catch (err) {}
      };
      reader.readAsDataURL(file);
    });

    function shuffleDoors() {
      const shuffled = [...writers].sort(() => Math.random() - 0.5).slice(0, 3);
      for (let i = 0; i < 3; i++) {
        document.getElementById(`plaque-${i}`).textContent = shuffled[i];
      }
      document.querySelectorAll('.door-wrapper').forEach(d => d.classList.remove('opening'));
    }

    document.getElementById('btn-shuffle').addEventListener('click', shuffleDoors);

    async function fetchFreeAI(prompt) {
      const seed = Math.floor(Math.random() * 100000);
      const url = `https://text.pollinations.ai/${encodeURIComponent(prompt)}?seed=${seed}&json=true`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('Network error');
      let text = await response.text();
      text = text.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
      const firstBrace = text.indexOf('{');
      const lastBrace = text.lastIndexOf('}');
      if (firstBrace !== -1 && lastBrace !== -1) {
        text = text.slice(firstBrace, lastBrace + 1);
      }
      return JSON.parse(text);
    }

    let isBusy = false;

    document.querySelectorAll('.door-wrapper').forEach((door) => {
      door.addEventListener('click', () => {
        if (isBusy) return;
        isBusy = true;

        const index = door.getAttribute('data-index');
        const writerName = document.getElementById(`plaque-${index}`).textContent;
        door.classList.add('opening');

        const roll = Math.floor(Math.random() * 3);

        setTimeout(async () => {
          document.getElementById('doors-stage').style.display = 'none';
          document.getElementById('stage-hint').style.display = 'none';

          if (roll === 0) {
            renderStudyMode(writerName);
            isBusy = false;
          } else if (roll === 1) {
            document.getElementById('loader').style.display = 'flex';
            await renderWritingMode(writerName);
            document.getElementById('loader').style.display = 'none';
            isBusy = false;
          } else {
            document.getElementById('loader').style.display = 'flex';
            await renderSelfDevMode(writerName);
            document.getElementById('loader').style.display = 'none';
            isBusy = false;
          }
        }, 750);
      });
    });

    function renderStudyMode(writerName) {
      const isNotes = Math.random() < 0.5;
      const taskTitle = isNotes ? "Время писать конспект" : "Время выполнить домашнее задание";
      const taskDesc = isNotes
        ? `${writerName} закрылась за твоей спиной. Доставай тетрадь или открывай документ: ближайшие 30 минут посвяти структурированному конспекту по предмету, который сейчас важнее всего.`
        : `${writerName} требует практики! Выбери одно конкретное домашнее задание по учёбе и погрузись в него на полчаса без отвлечений.`;

      showResultCard({
        badge: "Учёба • Фокус-сессия",
        title: taskTitle,
        body: taskDesc,
        extra: "Совет: убери телефон экраном вниз до того, как прозвенит таймер.",
        showTimer: true,
        status: "Режим концентрации"
      });
      resetTimer();
    }

    async function renderWritingMode(writerName) {
      const prompt = `Ты наставник по писательскому мастерству. Пользователь открыл "${writerName}". Выбери один конкретный литературный приём (например: кольцевая композиция, ненадежный рассказчик, чеховское ружьё, подтекст, ретардация, остранение, символ-лейтмотив, открытый финал) и посоветуй один конкретный небольшой рассказ (не самый заезженный из школьной программы), где этот приём ярко виден. Ответь строго на русском языке в формате JSON без лишнего текста: {"title": "Приём: [Название]", "body": "Краткое объяснение приёма (2-3 предложения) и рекомендация рассказа (Автор — «Название») с пояснением, где там искать этот приём.", "extra": "На что обратить внимание при чтении: [конкретная подсказка]", "quiz": [{"q": "Вопрос 1 на понимание приёма", "opts": ["Вариант 1", "Вариант 2", "Вариант 3"], "ans": 0}, {"q": "Вопрос 2", "opts": ["Вариант 1", "Вариант 2", "Вариант 3"], "ans": 1}, {"q": "Вопрос 3", "opts": ["Вариант 1", "Вариант 2", "Вариант 3"], "ans": 2}]}`;

      try {
        const data = await fetchFreeAI(prompt);
        if (!data || !data.title || !data.body) throw new Error('Bad JSON');
        showResultCard({
          badge: "Писательство • Разбор и тест",
          title: data.title,
          body: data.body,
          extra: data.extra || "",
          quiz: data.quiz || null,
          status: "Сгенерировано ИИ (Pollinations)"
        });
      } catch (e) {
        const item = fallbackWriting[Math.floor(Math.random() * fallbackWriting.length)];
        showResultCard({
          badge: "Писательство • Разбор и тест",
          title: item.title,
          body: item.body,
          extra: item.extra,
          quiz: item.quiz,
          status: "Резервный архив библиотеки"
        });
      }
    }

    async function renderSelfDevMode(writerName) {
      const prompt = `Пользователь открыл "${writerName}" и попал в раздел "Саморазвитие". Предложи одну увлекательную, небанальную тему для самостоятельного изучения сегодня (психология, когнитивистика, история искусства, философия или риторика). Ответь строго на русском языке в формате JSON без лишнего текста: {"title": "Название темы", "body": "Увлекательное введение в тему (3-4 предложения), почему это интересно знать студенту.", "extra": "Что конкретно сделать прямо сейчас: [посмотреть лекцию на тему..., почитать о..., или провести мини-эксперимент]"}`;

      try {
        const data = await fetchFreeAI(prompt);
        if (!data || !data.title || !data.body) throw new Error('Bad JSON');
        showResultCard({
          badge: "Саморазвитие • Исследование",
          title: data.title,
          body: data.body,
          extra: data.extra || "",
          status: "Сгенерировано ИИ (Pollinations)"
        });
      } catch (e) {
        const item = fallbackSelfDev[Math.floor(Math.random() * fallbackSelfDev.length)];
        showResultCard({
          badge: "Саморазвитие • Исследование",
          title: item.title,
          body: item.body,
          extra: item.extra,
          status: "Резервный архив библиотеки"
        });
      }
    }

    function showResultCard({ badge, title, body, extra, showTimer = false, quiz = null, status = "" }) {
      document.getElementById('res-badge').textContent = badge;
      document.getElementById('res-title').textContent = title;
      document.getElementById('res-body').textContent = body;
      document.getElementById('status-label').textContent = status;

      const extraEl = document.getElementById('res-extra');
      if (extra) {
        extraEl.textContent = extra;
        extraEl.style.display = 'block';
      } else {
        extraEl.style.display = 'none';
      }

      document.getElementById('timer-box').style.display = showTimer ? 'flex' : 'none';

      const quizSec = document.getElementById('quiz-section');
      const quizCont = document.getElementById('quiz-container');
      quizCont.innerHTML = '';

      if (quiz && Array.isArray(quiz) && quiz.length > 0) {
        quizSec.style.display = 'block';
        quiz.forEach((item, qIdx) => {
          const qDiv = document.createElement('div');
          qDiv.className = 'quiz-item';
          qDiv.innerHTML = `<div class="quiz-question">${qIdx + 1}. ${item.q}</div>`;

          const optsDiv = document.createElement('div');
          optsDiv.className = 'quiz-options';

          item.opts.forEach((optText, oIdx) => {
            const btn = document.createElement('button');
            btn.className = 'quiz-opt';
            btn.textContent = optText;
            btn.addEventListener('click', () => {
              const allBtns = optsDiv.querySelectorAll('button');
              allBtns.forEach(b => b.disabled = true);
              if (oIdx === item.ans) {
                btn.classList.add('correct');
              } else {
                btn.classList.add('wrong');
                if (allBtns[item.ans]) allBtns[item.ans].classList.add('correct');
              }
            });
            optsDiv.appendChild(btn);
          });

          qDiv.appendChild(optsDiv);
          quizCont.appendChild(qDiv);
        });
      } else {
        quizSec.style.display = 'none';
      }

      document.getElementById('result-card').style.display = 'block';
    }

    document.getElementById('btn-back').addEventListener('click', () => {
      stopTimer();
      document.getElementById('result-card').style.display = 'none';
      document.getElementById('doors-stage').style.display = 'flex';
      document.getElementById('stage-hint').style.display = 'block';
      shuffleDoors();
    });

    let timerSeconds = 30 * 60;
    let timerInterval = null;

    function updateTimerDisplay() {
      const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const s = (timerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      document.getElementById('timer-toggle-btn').textContent = "▶ Старт";
    }

    function resetTimer() {
      stopTimer();
      timerSeconds = 30 * 60;
      updateTimerDisplay();
    }

    document.getElementById('timer-toggle-btn').addEventListener('click', () => {
      const btn = document.getElementById('timer-toggle-btn');
      if (timerInterval) {
        stopTimer();
      } else {
        btn.textContent = "❚❚ Пауза";
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            stopTimer();
            alert("Время вышло! Отличная работа, можно сделать перерыв.");
          }
        }, 1000);
      }
    });

    document.getElementById('timer-reset-btn').addEventListener('click', resetTimer);

    shuffleDoors();
  </script>
</body>
</html>
